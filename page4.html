<!DOCTYPE html>
<html>

<head>

<title>Secret Friendship Letter 💌</title>

<style>

body{
    background:#ffe6f2;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:30px;
}

.letter{
    max-width:700px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:25px;
    box-shadow:0 5px 20px #ffb6d9;
}

h1{
    color:#ff1493;
}

#letter{
    font-size:22px;
    color:#444;
    line-height:1.8;
    white-space:pre-line;
    text-align:left;
}

button{
    background:#ff1493;
    color:white;
    border:none;
    padding:15px 30px;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    margin-top:25px;
}

button:hover{
    background:#ff3399;
}

/* Floating Hearts */

.heart{
    position:fixed;
    top:-10%;
    font-size:25px;
    animation:fall 8s linear infinite;
    pointer-events:none;
    z-index:999;
}

@keyframes fall{

from{
    transform:translateY(-10vh);
}

to{
    transform:translateY(110vh);
}

}

</style>

</head>

<body>

<div class="letter">

<h1>💌 Secret Friendship Letter 💌</h1>

<p id="letter"></p>

<button onclick="openGallery()">
📸 Open Friendship Gallery
</button>

</div>

<script>

const text = `Dear Yogi ji,

Thank you for always being there for me. ❤️

You are one of the most beautiful parts of my life.

Every smile, every laugh and every memory with you is a treasure that I will always keep in my heart.

No matter where life takes us, our friendship will stay forever.

Thank you for making my life happier and brighter.

Happy Friendship Day Yogi ji! 🌸

Forever Friends... ♾️💖`;

let i = 0;

function typeLetter(){

    if(i < text.length){

        document.getElementById("letter").innerHTML += text.charAt(i);

        i++;

        setTimeout(typeLetter,40);

    }

}

window.onload = typeLetter;

function openGallery(){

    window.location.href="page5.html";

}

</script>

<body>

<!-- Floating Hearts -->

<div class="heart" style="left:10%;animation-delay:0s;">💖</div>
<div class="heart" style="left:25%;animation-delay:2s;">💕</div>
<div class="heart" style="left:40%;animation-delay:4s;">💗</div>
<div class="heart" style="left:60%;animation-delay:1s;">💝</div>
<div class="heart" style="left:80%;animation-delay:3s;">❤️</div>

</body>

</html>
