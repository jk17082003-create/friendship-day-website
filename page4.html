<!DOCTYPE html>
<html>
<head>

<title>Secret Friendship Letter</title>

<style>
body{
  background:#ffe6f2;
  color:#e0a5cf;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:30px;
}

#letter{
    font-size:22px;
    line-height:1.8;
    color:#444;
    white-space:pre-line;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 15px #ffb6d9;
}

h1{
  color:#ff1493;
}
</style>


</head>

<body>

<div class="letter">

<h1>💌 Secret Friendship Letter</h1>

<p id="letter"></p>

</div>
<br>

<button onclick="openGallery()">
Open Friendship Gallery 📸
</button>

<script>
function openGallery(){
  window.location.href = "page5.html";
}
<script>

const text = `Dear Best Friend,

Thank you for always being there for me. ❤️

Every smile, every laugh and every memory with you is a treasure.

No matter where life takes us, our friendship will always stay strong.

Happy Friendship Day! 🌸

Forever Friends... ♾️💖`;

let i = 0;

function typeLetter() {
    if (i < text.length) {
        document.getElementById("letter").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeLetter, 45);
    }
}

window.onload = typeLetter;

</script>

</script>

</body>
</html>
