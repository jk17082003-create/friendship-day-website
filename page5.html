<!DOCTYPE html>
<html>
<head>

<title>Friendship Gallery</title>

<style>

body{
    background:#ffe6f2;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:20px;
}

h1{
    color:#ff1493;
}

.gallery{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.card{
    background:white;
    width:250px;
    padding:15px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(255,105,180,0.3);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
    border-radius:15px;
}

.card p{
    color:#ff1493;
    font-size:18px;
    font-weight:bold;
}

button{
    background:#ff1493;
    color:white;
    border:none;
    padding:15px 30px;
    border-radius:30px;
    cursor:pointer;
    font-size:18px;
    margin-top:30px;
}

button:hover{
    background:#e60073;
}

</style>

</head>

<body>

<h1>📸 Our Friendship Gallery 💖</h1>

<div class="gallery">

<div class="card">
<img src="photo1.jpg" alt="Memory 1">
<p>Beautiful Memory ✨</p>
</div>

<div class="card">
<img src="photo2.jpg" alt="Memory 2">
<p>Special Moment ❤️</p>
</div>

<div class="card">
<img src="photo3.jpg" alt="Memory 3">
<p>Forever Memories 💖</p>
</div>

<div class="card">
<img src="photo4.jpg" alt="Memory 4">
<p>Crazy Times 😄</p>
</div>

<div class="card">
<img src="photo5.jpg" alt="Memory 5">
<p>Best Friendship 🌸</p>
</div>

<div class="card">
<img src="photo6.jpg" alt="Memory 6">
<p>Always Together ♾️</p>
</div>

</div>

<br>

<button onclick="finalPage()">🎁 Final Surprise</button>

<script>
function finalPage(){
    window.location.href="page6.html";
}
</script>

</body>
</html>
