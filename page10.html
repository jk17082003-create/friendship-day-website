<!DOCTYPE html>
<html>

<head>

<title>Grand Finale ❤️</title>

<style>

body{
    background:linear-gradient(135deg,#ffd6e7,#fff0f7);
    font-family:Arial,sans-serif;
    text-align:center;
    padding:30px;
    overflow:hidden;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:30px;
    box-shadow:0 5px 20px #ffb6d9;
}

h1{
    color:#ff1493;
    font-size:45px;
}

p{
    color:#444;
    font-size:22px;
    line-height:1.6;
}

.heart{
    font-size:60px;
}

button{
    background:#ff1493;
    color:white;
    border:none;
    padding:15px 30px;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
}

.small{
    margin-top:30px;
    color:#ff69b4;
    font-size:16px;
}

/* Floating Hearts */

.heart{
    position:fixed;
    top:-10%;
    font-size:25px;
    animation:fall 8s linear infinite;
    pointer-events:none;
    z-index:999;
}

@keyframes fall{

from{
    transform:translateY(-10vh);
}

to{
    transform:translateY(110vh);
}

}

</style>

</head>

<body>

<div class="container">

<div class="heart">💖</div>

<h1>Our Friendship Forever 🌸</h1>

<p>
Thank you for being a beautiful part of my journey. ❤️
</p>

<p>
No matter where life takes us,
our memories and friendship will always stay special. ✨
</p>

<h2>Forever Special Friends ♾️</h2>

<button onclick="restart()">
🔄 Restart Adventure
</button>

<p class="small">
Made with ❤️ for My Special Friend Yogi ji
</p>

</div>


<script>

function restart(){
    window.location.href="index.html";
}

</script>

<body>

<!-- Floating Hearts -->

<div class="heart" style="left:10%;animation-delay:0s;">💖</div>
<div class="heart" style="left:25%;animation-delay:2s;">💕</div>
<div class="heart" style="left:40%;animation-delay:4s;">💗</div>
<div class="heart" style="left:60%;animation-delay:1s;">💝</div>
<div class="heart" style="left:80%;animation-delay:3s;">❤️</div>

</body>

<audio autoplay loop controls>
  <source src="music.mp3" type="audio/mpeg">
</audio>

</html>
