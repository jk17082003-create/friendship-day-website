<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FBI Friendship File</title>

<style>

body{
    background:#ffe6f2;
    color:#333;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:30px;
    overflow-x:hidden;
}


.file{

    background:white;
    border:3px solid #ffcc00;
    border-radius:25px;
    padding:30px;
    max-width:600px;
    margin:auto;
    box-shadow:0 10px 25px rgba(255,20,147,.2);
    animation:fade 1s;

}


h1{
    color:#ff1493;
}


h2{
    color:#d63384;
}


p{

    font-size:20px;
    line-height:1.6;

}


button{

    background:#ff1493;
    color:white;
    border:none;
    padding:15px 30px;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;

}


button:hover{

    background:#e60073;
    transform:scale(1.05);

}




@keyframes fade{

from{

opacity:0;
transform:translateY(30px);

}

to{

opacity:1;
transform:translateY(0);

}

}


/* Mobile */

@media(max-width:600px){

body{

padding:15px;

}

.file{

padding:20px;

}

h1{

font-size:28px;

}

p{

font-size:17px;

}

button{

width:90%;

}

}

</style>

</head>


<body>


<div class="file">


<h1>🕵️ FBI Friendship File</h1>


<h2>CONFIDENTIAL 💌</h2>


<p>
📁 File Name: Best Friendship Memories
</p>


<p>
❤️ Status: Forever Connected
</p>


<p>
✨ Mission: Collect beautiful memories and unlimited smiles
</p>


<button onclick="openFile()">

Open Secret File 🔐

</button>


</div>




<script>

function openFile(){

window.location.href="page3.html";

}

</script>


</body>

</html>
